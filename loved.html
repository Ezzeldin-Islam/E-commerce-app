<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-commerce</title>
    <link rel="stylesheet" href="fontawesome-free-7.1.0-web/css/all.min.css">
    <link rel="stylesheet" href="css/normalize.css">
    <link rel="stylesheet" href="css/master.css">
  </head>
  <body>

    <div class="scroll-top"><i class="fa-solid fa-chevron-up"></i></div>

    <div class="shopping-cart-container">
      <div class="container">
        <div class="cart-empty" style="display: none;">
          <div class="empty-icon">
            <i class="fa-solid fa-cart-shopping"></i>
          </div>
          <h3>Your cart is empty</h3>
          <p>Add some products to get started!</p>
          <a href="shop.html"><button class="btn continue-shopping">Continue
              Shopping</button></a>
        </div>
      </div>

    </div>

    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/headroom/0.12.0/headroom.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="js/main.js"></script>
    <script src="js/loved.js"></script>

  </body>
</html>
